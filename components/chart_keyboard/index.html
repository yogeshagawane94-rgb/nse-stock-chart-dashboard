<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; color: #89909e; font: 12px Arial, sans-serif; }
      #controls { display: flex; align-items: center; gap: 10px; height: 30px; }
      #fullscreen { box-sizing: border-box; height: 28px; padding: 5px 9px; border: 1px solid #282e38; border-radius: 3px; background: #14181f; color: #d1d4dc; cursor: pointer; font: inherit; }
      #fullscreen:hover, #fullscreen:focus { border-color: #2962ff; }
      #key-hint { color: #89909e; }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="fullscreen" type="button">Fullscreen</button>
      <span id="key-hint">Use left/right arrows to browse charts</span>
    </div>
    <div hidden id="old-key-hint" tabindex="0" title="Use the left and right arrow keys to change charts">
      Click chart area, then press â† / â†’ to change charts
    </div>
    <script>
      const hint = document.getElementById("key-hint");
      const fullscreenButton = document.getElementById("fullscreen");
      const postToStreamlit = (type, data = {}) => {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      };
      let eventNumber = 0;

      function setFullscreen(enabled) {
        try {
          window.parent.document.body.classList.toggle("chart-navigation-fullscreen", enabled);
          fullscreenButton.textContent = enabled ? "Exit fullscreen" : "Fullscreen";
        } catch (_) {
          hint.textContent = "Fullscreen control is unavailable in this browser";
        }
      }

      fullscreenButton.addEventListener("click", () => {
        const active = window.parent.document.body.classList.contains("chart-navigation-fullscreen");
        setFullscreen(!active);
      });

      function sendKey(event) {
        const target = event.target;
        if (target && (target.closest("input, textarea, select, button, [contenteditable='true'], [data-testid='stDataFrame']"))) return;
        if (event.key === "Escape") {
          try {
            if (window.parent.document.body.classList.contains("chart-navigation-fullscreen")) {
              setFullscreen(false);
              event.preventDefault();
              event.stopPropagation();
            }
          } catch (_) {}
          return;
        }
        const direction = event.key === "ArrowRight" ? "next" : event.key === "ArrowLeft" ? "previous" : null;
        if (!direction) return;
        event.preventDefault();
        event.stopPropagation();
        eventNumber += 1;
        postToStreamlit("streamlit:setComponentValue", {
          value: { direction, event_id: `${Date.now()}-${eventNumber}` },
          dataType: "json"
        });
      }

      window.addEventListener("keydown", sendKey, true);
      try { window.parent.document.addEventListener("keydown", sendKey, true); } catch (_) {}
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          const symbol = event.data.args && event.data.args.symbol;
          try {
            const active = window.parent.document.body.classList.contains("chart-navigation-fullscreen");
            fullscreenButton.textContent = active ? "Exit fullscreen" : "Fullscreen";
          } catch (_) {}
          hint.textContent = symbol
            ? `${symbol} Â· Press â† / â†’ to browse charts`
            : "Click chart area, then press â† / â†’ to change charts";
        }
      });
      postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
      postToStreamlit("streamlit:setFrameHeight", { height: 34 });
    </script>
  </body>
</html>
