name: Daily stock screener refresh

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SAVE_CHARTS: "false"
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install screener dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh NSE symbol universe
        run: python download_nse_universe.py

      - name: Run base screener
        run: python screener.py

      - name: Run chart-pattern analysis
        run: python pattern_analyzer.py

      - name: Validate refreshed CSVs
        run: python validate_refresh.py

      - name: Publish updated CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- symbols.csv screened_charts/matches.csv pattern_charts/pattern_matches.csv
          if git diff --cached --quiet; then
            echo "No screener data changes to publish."
          else
            git commit -m "Refresh daily NSE screener data [skip ci]"
            git push
          fi